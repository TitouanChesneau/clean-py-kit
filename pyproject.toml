[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanpykit"
version = "0.1.0"
description = "Production-ready foundation for Python applications"
authors = [{name = "BigPocc"}]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["src"]
