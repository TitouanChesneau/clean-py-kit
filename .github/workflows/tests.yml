name: tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10.8"
      - run: pip install -e .[dev]
      - run: pytest --cov=pybase --cov-report=term-missing
      - uses: codecov/codecov-action@v4